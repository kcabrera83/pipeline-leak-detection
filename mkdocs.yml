site_name: Pipeline Leak Detection
site_description: Real-time leak detection from pressure and flow rate sensor monitoring.
repo_url: https://github.com/kcabrera83/pipeline-leak-detection
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - API Reference: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
