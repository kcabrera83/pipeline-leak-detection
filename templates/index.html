<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Leak Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
        .header { background: linear-gradient(135deg, #1e293b, #334155); padding: 24px 32px; border-bottom: 2px solid #ef4444; }
        .header h1 { font-size: 24px; color: #ef4444; }
        .header p { color: #94a3b8; margin-top: 4px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        .card h3 { color: #ef4444; margin-bottom: 12px; font-size: 16px; }
        label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #475569;
            border-radius: 6px; color: #e2e8f0; font-size: 14px; margin-bottom: 12px; }
        button { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 6px;
            cursor: pointer; font-weight: 600; font-size: 14px; width: 100%; }
        button:hover { background: #dc2626; }
        .results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
        .result-box { background: #0f172a; border-radius: 8px; padding: 16px; text-align: center; border: 1px solid #475569; }
        .result-box .value { font-size: 24px; font-weight: 700; }
        .result-box .label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .leak-yes { color: #ef4444; border-color: #ef4444 !important; }
        .leak-no { color: #22c55e; border-color: #22c55e !important; }
        .chart-container { position: relative; height: 300px; margin-top: 12px; }
        .full-width { grid-column: 1 / -1; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Pipeline Leak Detection Dashboard</h1>
        <p>Deteccion inteligente de fugas en tuberias de petroleo y gas</p>
    </div>
    <div class="container">
        <div class="grid">
            <div class="card">
                <h3>Detectar Fuga</h3>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                    <div><label>Tipo tuberia</label>
                        <select id="pipeline_type">
                            <option value="crude_oil">Crudo</option>
                            <option value="natural_gas">Gas Natural</option>
                            <option value="refined_product">Refinado</option>
                            <option value="water_injection">Inyeccion Agua</option>
                        </select>
                    </div>
                    <div><label>Longitud (km)</label><input type="number" id="pipeline_length" value="50"></div>
                    <div><label>Diametro (mm)</label><input type="number" id="diameter" value="200"></div>
                    <div><label>Presion upstream (MPa)</label><input type="number" id="pressure_up" value="5.0" step="0.1"></div>
                    <div><label>Presion downstream (MPa)</label><input type="number" id="pressure_down" value="4.0" step="0.1"></div>
                    <div><label>Caudal (m3/h)</label><input type="number" id="flow_rate" value="200"></div>
                    <div><label>Temp. tuberia (C)</label><input type="number" id="temperature" value="25"></div>
                    <div><label>Temp. ambiente (C)</label><input type="number" id="ambient_temp" value="20"></div>
                    <div><label>Humedad suelo (%)</label><input type="number" id="soil_moisture" value="40"></div>
                    <div><label>Espesor pared (mm)</label><input type="number" id="wall_thickness" value="12"></div>
                    <div><label>Emision acustica (dB)</label><input type="number" id="acoustic" value="10" step="0.1"></div>
                    <div><label>Dif. temperatura (C)</label><input type="number" id="temp_diff" value="1" step="0.1"></div>
                </div>
                <button onclick="detect()">Detectar</button>
                <div class="results" id="predResults">
                    <div class="result-box" id="leakBox"><div class="value" id="leakStatus">--</div><div class="label">Estado</div></div>
                    <div class="result-box"><div class="value" id="leakProb">--</div><div class="label">Probabilidad</div></div>
                    <div class="result-box"><div class="value" id="leakSeverity">--</div><div class="label">Severidad</div></div>
                </div>
            </div>

            <div class="card">
                <h3>Distribucion de Probabilidades</h3>
                <div class="chart-container"><canvas id="probChart"></canvas></div>
            </div>

            <div class="card full-width">
                <h3>Simulacion en Tiempo Real</h3>
                <button onclick="simulateRealTime()" style="background:#22c55e;color:white;margin-bottom:12px">Iniciar Simulacion</button>
                <div class="chart-container"><canvas id="realtimeChart"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        let probChart = null;
        let rtChart = null;
        let rtInterval = null;

        async function detect() {
            const body = {
                pipeline_type: document.getElementById("pipeline_type").value,
                pipeline_length_km: document.getElementById("pipeline_length").value,
                pipeline_diameter_mm: document.getElementById("diameter").value,
                pressure_upstream_mpa: document.getElementById("pressure_up").value,
                pressure_downstream_mpa: document.getElementById("pressure_down").value,
                flow_rate_m3h: document.getElementById("flow_rate").value,
                temperature_c: document.getElementById("temperature").value,
                ambient_temp_c: document.getElementById("ambient_temp").value,
                soil_moisture_pct: document.getElementById("soil_moisture").value,
                pipe_wall_thickness_mm: document.getElementById("wall_thickness").value,
                acoustic_emission_db: document.getElementById("acoustic").value,
                temperature_diff_c: document.getElementById("temp_diff").value,
            };
            const res = await fetch("/api/predict", {
                method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.status === "ok") {
                const leakBox = document.getElementById("leakBox");
                const statusEl = document.getElementById("leakStatus");
                if (data.has_leak) {
                    leakBox.className = "result-box leak-yes";
                    statusEl.textContent = "FUGA";
                    statusEl.style.color = "#ef4444";
                } else {
                    leakBox.className = "result-box leak-no";
                    statusEl.textContent = "NORMAL";
                    statusEl.style.color = "#22c55e";
                }
                document.getElementById("leakProb").textContent = (data.leak_probability * 100).toFixed(1) + "%";
                document.getElementById("leakSeverity").textContent = data.leak_severity || "N/A";
            }
        }

        async function simulateRealTime() {
            if (rtInterval) { clearInterval(rtInterval); rtChart.destroy(); rtChart = null; rtInterval = null; return; }
            const labels = [];
            const probs = [];
            const ctx = document.getElementById("realtimeChart").getContext("2d");
            rtChart = new Chart(ctx, {
                type: "line",
                data: { labels, datasets: [{ label: "Leak Prob %", data: probs, borderColor: "#ef4444", fill: true, backgroundColor: "rgba(239,68,68,0.1)", tension: 0.3, pointRadius: 2 }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: {color:"#94a3b8"}, grid:{color:"#334155"} }, y: { min:0, max:100, ticks:{color:"#94a3b8"}, grid:{color:"#334155"} } }, plugins:{legend:{labels:{color:"#e2e8f0"}}} }
            });
            let t = 0;
            rtInterval = setInterval(async () => {
                const body = {
                    pipeline_type: "crude_oil", pipeline_length_km: 50, pipeline_diameter_mm: 200,
                    pressure_upstream_mpa: 5, pressure_downstream_mpa: 4, flow_rate_m3h: 200,
                    temperature_c: 25, ambient_temp_c: 20, soil_moisture_pct: 40,
                    pipe_wall_thickness_mm: 12, pressure_drop_mpa: 1 + Math.random() * 0.5,
                    flow_anomaly_m3h: Math.random() * 2, acoustic_emission_db: 10 + Math.random() * 30,
                    temperature_diff_c: Math.random() * 5, vibration_level_g: 0.3 + Math.random() * 1.5,
                };
                const res = await fetch("/api/predict", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
                const data = await res.json();
                if (data.status === "ok") {
                    labels.push(t++);
                    probs.push(data.leak_probability * 100);
                    if (labels.length > 50) { labels.shift(); probs.shift(); }
                    rtChart.update();
                }
            }, 1500);
        }
    </script>
</body>
</html>
